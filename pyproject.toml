[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torshammer"
version = "2.0.0"
description = "Tor's Hammer 2.0 - modern slow-requests DoS/Vulnerability testing tool (asyncio, TLS, proxies)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Tor's Hammer contributors" }]
keywords = ["security", "pentest", "slowloris", "slow-post", "dos", "testing"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
torshammer = "torshammer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torshammer = ["py.typed", "banner.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/torshammer --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/torshammer"]
omit = ["legacy/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
exclude = ["legacy"]

# Pylance/Pyright policy for this repository.
#
# The committed quality gate is `ruff check` + `ruff format --check` + `mypy src/`
# (see .woodpecker.yml). Pyright's `strict` mode additionally enables the
# "partially unknown" family of rules, which fires pervasively on
# `argparse.Namespace` attributes and on untyped pytest fixtures without
# describing real defects. The policy below keeps `standard` as the baseline and
# re-enables the strict rules that have actually caught bugs here.
#
# Note: when a `[tool.pyright]` section exists, Pylance ignores pyright settings
# from VS Code's settings.json, so this file is the single source of truth.
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
extraPaths = ["src"]
# Strict-only rules worth keeping on (all four found real issues).
reportMissingTypeArgument = "error"
reportConstantRedefinition = "error"
reportUnnecessaryComparison = "error"
reportUnusedFunction = "warning"

# Tests legitimately exercise module-private CLI helpers (`_resolve_config`,
# `_check_target_policy`, ...). That only reports under `strict`, so no
# per-directory override is needed while the baseline stays `standard`.
