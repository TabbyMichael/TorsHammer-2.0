services:
  forgejo:
    # Forgejo server (v13) paired with forgejo-runner v13
    image: codeberg.org/forgejo/forgejo:13
    container_name: forgejo
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: "http://localhost:3000/"
      FORGEJO__server__HTTP_ADDR: "0.0.0.0"
      FORGEJO__server__HTTP_PORT: "3000"
      # Enable the Actions/CI feature
      FORGEJO__actions__ENABLED: "true"
      # Fetch third-party actions (checkout, setup-python, ...) from GitHub
      FORGEJO__actions__DEFAULT_ACTIONS_URL: "github"
      # Mark the instance as installed and persist a stable secret key
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: "${FORGEJO_SECRET_KEY:?set FORGEJO_SECRET_KEY in .env}"
    restart: unless-stopped
    volumes:
      - ./forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"   # web UI / Git over HTTP
      - "2222:22"     # Git over SSH (host port 2222)

  # NOTE: The Forgejo Actions runner is run as a host service (see
  # selfhost/runner/run.sh / install.sh) because it must reach podman's
  # Docker-compatible socket. See selfhost/README.md for details.

