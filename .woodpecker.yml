kind: pipeline
type: docker
name: default

steps:
  - name: test-3.11
    image: python:3.11-slim
    commands:
      - python -m pip install --upgrade pip
      - pip install -e "[dev]"
      - pytest
      - python -m pip install ruff mypy
      - ruff check .
      - ruff format --check .
      - mypy src/

  - name: test-3.12
    image: python:3.12-slim
    commands:
      - python -m pip install --upgrade pip
      - pip install -e "[dev]"
      - pytest
      - python -m pip install ruff mypy
      - ruff check .
      - ruff format --check .
      - mypy src/

  - name: test-3.13
    image: python:3.13-slim
    commands:
      - python -m pip install --upgrade pip
      - pip install -e "[dev]"
      - pytest
      - python -m pip install ruff mypy
      - ruff check .
      - ruff format --check .
      - mypy src/

trigger:
  event:
    - push
    - pull_request
  branch:
    - main
    - develop
