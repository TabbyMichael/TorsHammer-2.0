name: Test

# Forgejo Actions workflow (runs on your self-hosted Forgejo instance).
# Forgejo reads workflows from .forgejo/workflows/ (the .github one is
# only used by GitHub.com, whose Actions are locked for this account).
#
# Self-hosted runners can only provide Ubuntu/Linux; macOS/Windows jobs
# would require dedicated physical machines, so the OS matrix is replaced
# with the full Python version matrix on ubuntu-latest.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest

    - name: Run ruff check
      run: |
        pip install ruff
        ruff check .

    - name: Run ruff format check
      run: |
        ruff format --check .

    - name: Run mypy
      run: |
        pip install mypy
        mypy src/