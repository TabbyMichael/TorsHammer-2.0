name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      FORGEJO_HOST: ${{ secrets.FORGEJO_HOST }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Verify tests pass before releasing
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pytest

    - name: Build distributions
      run: |
        pip install build twine
        python -m build
        twine check dist/*

    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > SHA256SUMS

    - name: Generate SBOM inputs (zero runtime deps; freeze the build env)
      run: |
        pip freeze > dist/requirements-freeze.txt
        pip install cyclonedx-bom
        cyclonedx-py environment "$(python -c 'import sys; print(sys.prefix)')" \
            -o dist/sbom-python.json || echo "SBOM generation skipped (freeze kept)"

    - name: Sign artifacts with sigstore (cosign keyless, if available)
      run: |
        if command -v cosign >/dev/null 2>&1; then
          for f in dist/*.whl dist/*.tar.gz dist/sbom-python.json; do
            [ -f "$f" ] && cosign sign-blob --yes "$f" || true
          done
        else
          echo "cosign not available; skipping (install cosign in runner image)"
        fi

    - name: Publish to PyPI
      if: env.PYPI_API_TOKEN != ''
      run: |
        twine upload --non-interactive --username __token__ --password "$PYPI_API_TOKEN" dist/*.whl dist/*.tar.gz

    - name: Publish to Forgejo generic package
      if: env.FORGEJO_TOKEN != '' && env.FORGEJO_HOST != ''
      run: |
        TAG="${GITHUB_REF_NAME:-unknown}"
        for f in dist/*.whl dist/*.tar.gz dist/sbom-python.json dist/SHA256SUMS; do
          [ -f "$f" ] || continue
          curl -sf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$f" \
            "${FORGEJO_HOST}/api/packages/torshammer/generic/torshammer/${TAG}/$(basename "$f")" \
            || echo "package upload skipped for $(basename "$f")"
        done

    - name: Create release and attach artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: |
        docker build \
          --build-arg VERSION="${GITHUB_REF_NAME:-0.0.0}" \
          --build-arg REVISION="$(git rev-parse HEAD)" \
          -t torshammer:"${GITHUB_REF_NAME:-dev}" .

    - name: Smoke-test image
      run: docker run --rm torshammer:"${GITHUB_REF_NAME:-dev}" --help

    - name: Push to registry
      if: env.REGISTRY_TOKEN != ''
      run: |
        HOST="${REGISTRY_HOST:-ghcr.io}"
        echo "$REGISTRY_TOKEN" | docker login "$HOST" -u "$REGISTRY_USER" --password-stdin
        docker tag torshammer:"${GITHUB_REF_NAME:-dev}" "${HOST}/${REGISTRY_USER}/torshammer:${GITHUB_REF_NAME}"
        docker push "${HOST}/${REGISTRY_USER}/torshammer:${GITHUB_REF_NAME}"