name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Verify tests pass before releasing
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pytest

    - name: Build distributions
      run: |
        pip install build twine
        python -m build
        twine check dist/*

    - name: Generate checksums
      run: |
        cd dist
        sha256sum * > SHA256SUMS

    - name: Generate SBOM inputs
      run: |
        pip freeze > dist/requirements-freeze.txt
        pip install cyclonedx-bom
        cyclonedx-py environment "$(python -c 'import sys; print(sys.prefix)')" \
            -o dist/sbom-python.json || echo "SBOM generation skipped (freeze kept)"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

    - name: Create GitHub Release and attach artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        generate_release_notes: true
