name: CI

# Canonical merge gate for the GitHub remote (origin). Runs the dual-backend
# gates (Python + Rust) plus a Woodpecker parity check on every push/PR.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Syntax gate (compileall)
      run: python -m compileall src/

    - name: Import smoke test (resource-free import path)
      run: python -c "import torshammer.cli as c; print('HAS_RESOURCE=', c.HAS_RESOURCE)"

    - name: Run tests
      run: pytest

    - name: ruff check
      run: |
        pip install ruff==0.16.2
        ruff check .

    - name: ruff format check
      run: ruff format --check .

    - name: mypy
      run: |
        pip install mypy==2.3.0
        mypy src/

  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Format check
      run: cargo fmt --manifest-path rust/Cargo.toml -- --check

    - name: Clippy
      run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

    - name: Build
      run: cargo build --manifest-path rust/Cargo.toml

    - name: Test
      run: cargo test --manifest-path rust/Cargo.toml

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Coverage gate (rust/src, 100% lines via lcov)
      # Gate on the lcov line model, not --fail-under-lines 100: cargo-llvm-cov
      # 0.9.1's `report` model spuriously flags ~12 already-executed
      # continuation/brace lines in engine/mod.rs + main.rs that show/lcov
      # count as covered. See docs/testing.md "Rust backend coverage".
      run: |
        rustup component add llvm-tools-preview
        mkdir -p rust/target/llvm-cov
        cargo llvm-cov --manifest-path rust/Cargo.toml --all-targets --lcov --output-path rust/target/llvm-cov/lcov.info
        python3 scripts/rust_cov_gate.py rust/target/llvm-cov/lcov.info

  yaml-sanity:
    # Cheap guard against the class of bug that broke .woodpecker.yml:
    # a CI config that no parser can read is worse than no config at all.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Parse every CI config
      run: |
        python -m pip install pyyaml
        python - <<'PY'
        import pathlib, yaml
        files = [".woodpecker.yml", *sorted(str(p) for p in pathlib.Path(".github/workflows").glob("*.yml"))]
        for f in files:
            yaml.safe_load(pathlib.Path(f).read_text())
            print(f"OK {f}")
        PY

