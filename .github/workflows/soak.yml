name: Soak Test

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent connections'
        required: false
        default: '2000'
      duration:
        description: 'Duration (seconds)'
        required: false
        default: '120'

jobs:
  soak:
    runs-on: ubuntu-latest
    env:
      SOAK_CONCURRENCY: ${{ github.event.inputs.concurrency || '2000' }}
      SOAK_DURATION: ${{ github.event.inputs.duration || '120' }}
      SOAK_MODE: slow-headers
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Raise descriptor limit
      run: |
        ulimit -n $(ulimit -Hn) || true
        ulimit -n

    - name: Run soak
      run: python scripts/soak.py --concurrency "$SOAK_CONCURRENCY" --duration "$SOAK_DURATION" --mode "$SOAK_MODE"
